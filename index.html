<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>井字棋 Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --x-color: #ef4444;
      --o-color: #10b981;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background: var(--card);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 380px;
      width: 100%;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    select, button {
      padding: 8px 14px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      background: #fff;
      transition: all 0.2s;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: 500;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 18px;
      min-height: 1.5em;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 10px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 2.8rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }

    .cell:hover:not(.taken) {
      background: #e2e8f0;
    }

    .cell:active:not(.taken) {
      transform: scale(0.96);
    }

    .cell.x {
      color: var(--x-color);
    }

    .cell.o {
      color: var(--o-color);
    }

    .cell.win {
      background: #fef08a;
      border-color: #eab308;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>井字棋 Tic-Tac-Toe</h1>

    <div class="controls">
      <select id="mode">
        <option value="pvp">双人对战</option>
        <option value="ai">人机对战 (AI)</option>
      </select>
      <button id="resetBtn">重新开始</button>
    </div>

    <div class="status" id="status">轮到玩家 X 落子</div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>
  </div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    const modeSelect = document.getElementById('mode');

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameActive = true;

    const winConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // 行
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // 列
      [0, 4, 8], [2, 4, 6]             // 对角线
    ];

    function handleCellClick(e) {
      const index = e.target.getAttribute('data-index');
      if (board[index] !== '' || !gameActive) return;

      makeMove(index, currentPlayer);

      if (gameActive && modeSelect.value === 'ai' && currentPlayer === 'O') {
        setTimeout(aiMove, 250);
      }
    }

    function makeMove(index, player) {
      board[index] = player;
      const cell = cells[index];
      cell.textContent = player;
      cell.classList.add('taken', player.toLowerCase());

      const winCombo = checkWin(player);
      if (winCombo) {
        statusText.textContent = `🎉 玩家 ${player} 获胜！`;
        gameActive = false;
        winCombo.forEach(i => cells[i].classList.add('win'));
        return;
      }

      if (!board.includes('')) {
        statusText.textContent = '🤝 双方平局！';
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusText.textContent = `轮到玩家 ${currentPlayer} 落子`;
    }

    function checkWin(player) {
      for (const combo of winConditions) {
        if (combo.every(index => board[index] === player)) {
          return combo;
        }
      }
      return null;
    }

    // 简单策略 AI：优先赢 -> 其次堵截 -> 抢占中心 -> 随机空位
    function aiMove() {
      if (!gameActive) return;

      let move = findBestMove('O') ?? findBestMove('X');
      if (move === null && board[4] === '') move = 4;
      if (move === null) {
        const empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
        move = empty[Math.floor(Math.random() * empty.length)];
      }

      makeMove(move, 'O');
    }

    function findBestMove(player) {
      for (const [a, b, c] of winConditions) {
        const line = [board[a], board[b], board[c]];
        if (line.filter(v => v === player).length === 2 && line.includes('')) {
          return [a, b, c][line.indexOf('')];
        }
      }
      return null;
    }

    function resetGame() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameActive = true;
      statusText.textContent = '轮到玩家 X 落子';
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
      });
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    resetBtn.addEventListener('click', resetGame);
    modeSelect.addEventListener('change', resetGame);
  </script>
</body>
</html>
